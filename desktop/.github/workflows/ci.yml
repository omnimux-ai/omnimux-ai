name: CI

on:
  pull_request:
    branches: [main, master, omnimux]
  push:
    branches: [main, master, omnimux]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  # Keep required checks conclusive for documentation-only changes. Workflow
  # path filters can leave required checks pending, so classify inside the run.
  changes:
    runs-on: ubuntu-latest
    outputs:
      product: ${{ steps.scope.outputs.product }}
      mac: ${{ steps.scope.outputs.mac }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          # GitHub's pull-request merge ref can retain the base branch's
          # submodule gitlink when the PR advances it to a descendant. Check
          # out the actual PR head so pinned submodules match upstream.json.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: 22.23.2
      - name: Classify changed paths
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          node --test scripts/bilingual-docs.test.mjs
          node scripts/verify-bilingual-docs.mjs
          node --test scripts/market-dependency-direction.test.mjs
          node scripts/verify-market-dependency-direction.mjs
          node --test scripts/build-plugin-provenance.test.mjs
          if [[ "$EVENT_NAME" == "workflow_dispatch" || -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            product=true
            mac=true
          else
            git diff --check "$BASE_SHA" "$HEAD_SHA"
            # The classifier prints one verdict per line: product, then mac.
            # Read them without `readarray`: that is a bash 4 builtin and the
            # step must stay portable to the bash 3.2 macOS runners too.
            verdicts="$(git diff --name-only -z "$BASE_SHA" "$HEAD_SHA" | node scripts/classify-ci-changes.mjs)"
            product="$(printf '%s\n' "$verdicts" | sed -n '1p')"
            mac="$(printf '%s\n' "$verdicts" | sed -n '2p')"
          fi
          echo "product=$product" >> "$GITHUB_OUTPUT"
          echo "mac=$mac" >> "$GITHUB_OUTPUT"

  # Product gate: AA profile smoke is temporarily paused below.
  # A documentation-only change already passed diff validation in `changes`.
  check:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Documentation-only gate
        if: needs.changes.outputs.product == 'false'
        run: echo "Documentation-only change; product build and tests are not required."
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        if: needs.changes.outputs.product == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        if: needs.changes.outputs.product == 'true'
        with:
          node-version: 22.23.2
      - if: needs.changes.outputs.product == 'true'
        run: corepack enable
      - name: Resolve Yarn cache folder
        if: needs.changes.outputs.product == 'true'
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        if: needs.changes.outputs.product == 'true'
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}
      - if: needs.changes.outputs.product == 'true'
        run: yarn install --immutable
      - name: Temporarily skip AA profile smoke in CI
        if: needs.changes.outputs.product == 'true'
        # Remove this step after AA Host service activation is fixed.
        # Local checks and the standalone verify:aa command remain available.
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          for (const workspace of ['dsh-plugin-desktop']) {
            const path = `${workspace}/package.json`
            const manifest = JSON.parse(readFileSync(path, 'utf8'))
            const smoke = ' && yarn run verify:aa'
            if (!manifest.scripts.check.includes(smoke)) throw new Error(`AA check not found in ${workspace}`)
            manifest.scripts.check = manifest.scripts.check.replace(smoke, '')
            writeFileSync(path, `${JSON.stringify(manifest, null, 2)}\n`)
          }
          NODE
      - if: needs.changes.outputs.product == 'true'
        run: node scripts/verify-version.mjs
      - if: needs.changes.outputs.product == 'true'
        run: yarn check

  # Windows-only logic and unsigned NSIS/portable builds on a real Windows runner:
  # updates, window options, pwsh sandbox, volume diagnostics, and packaging.
  # The package gate runs once; both artifacts reuse its build output.
  desktop-windows:
    needs: changes
    if: needs.changes.outputs.product == 'true'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: 22.23.2
      - run: corepack enable
      - name: Resolve Yarn cache folder
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$env:GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}
      - run: yarn install --immutable
      - run: yarn workspace dsh-plugin-desktop check:win-package
      # The installer runs first on purpose: the portable archive below reuses the
      # unpacked application tree this step leaves in dist/win-unpacked, so the
      # 840 MB runtime is assembled once instead of twice.
      - name: Build Windows installer
        env:
          DSH_PACKAGE_CHECK_ALREADY_RAN: '1'
          # CI artifacts are never published, so `store` skips the deflate pass
          # that otherwise dominates this step. Releases keep build.win.compression.
          DSH_WINDOWS_PACKAGE_COMPRESSION: store
        run: yarn workspace dsh-plugin-desktop dist:win
      - name: Build Windows portable archive
        env:
          DSH_PACKAGE_CHECK_ALREADY_RAN: '1'
          DSH_WINDOWS_PACKAGE_COMPRESSION: store
          # --prepackaged against the installer's output. If that tree is missing
          # electron-builder fails loudly rather than silently rebuilding it.
          DSH_WINDOWS_REUSE_UNPACKED: '1'
        run: yarn workspace dsh-plugin-desktop dist:win-portable
      # The release lane has no Windows host of its own: package-win.ts refuses
      # non-Windows hosts, so this job is the only place an official installer is
      # produced. Publish it so a release can collect the artifact instead of
      # rebuilding on a machine nobody keeps.
      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: windows-x64-release
          if-no-files-found: error
          retention-days: 30
          path: |
            dsh-plugin-desktop/dist/OmniMux-*-x64-Setup.exe
            dsh-plugin-desktop/dist/OmniMux-*-x64-Portable.zip
            dsh-plugin-desktop/dist/latest.yml

  # Single-CPU macOS packaging smoke on a real macOS runner. The signed release
  # is built manually on a credentialed machine, so an unsigned DMG here catches
  # packaging regressions before a manual release. No signing secrets reach this job.
  #
  # The dual-architecture merge is deliberately NOT built here: it costs ~14 of
  # this job's ~20 minutes and only changes when the macOS packaging scripts do.
  # `macos-universal` below covers that case, and the release lane always builds
  # universal, so no path ships unverified.
  desktop-macos:
    needs: changes
    if: needs.changes.outputs.product == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: 22.23.2
      - run: corepack enable
      - name: Resolve Yarn cache folder
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}
      - run: yarn install --immutable
      - run: yarn workspace dsh-plugin-desktop check:mac-package
      - name: Build macOS smoke artifact
        env:
          DSH_PACKAGE_CHECK_ALREADY_RAN: '1'
          # arm64 keeps the lipo merge out of every PR. verify-mac-smoke reads
          # the same variable, so the artifact is still verified as arm64-only.
          DSH_MAC_SMOKE_ARCH: arm64
          # The smoke DMG is never published, so zlib compression and the
          # blockmap only cost time.
          DSH_MAC_PACKAGE_COMPRESSION: store
        run: yarn workspace dsh-plugin-desktop dist:mac-smoke

  # The universal merge's own gate. It runs only when a path that can change the
  # dual-architecture package moved (see classify-ci-changes.mjs), because the
  # release lane builds universal and nothing else would catch a lipo regression
  # before a manual release. Compression stays at the package default so this
  # job exercises the same DMG path a release does.
  macos-universal:
    needs: changes
    if: needs.changes.outputs.product == 'true' && needs.changes.outputs.mac == 'true'
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: 22.23.2
      - run: corepack enable
      - name: Resolve Yarn cache folder
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}
      - run: yarn install --immutable
      - run: yarn workspace dsh-plugin-desktop check:mac-package
      - name: Build universal macOS smoke artifact
        env:
          DSH_PACKAGE_CHECK_ALREADY_RAN: '1'
          DSH_MAC_SMOKE_ARCH: universal
        run: yarn workspace dsh-plugin-desktop dist:mac-smoke

  # The Next shell has its own packaging entry points and its own runtime payloads,
  # so it needs its own packaging smoke. Without this job a Next release could ship
  # a Windows installer that was never built once.
  desktop-next-windows:
    needs: changes
    if: needs.changes.outputs.product == 'true'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: 22.23.2
      - run: corepack enable
      - name: Resolve Yarn cache folder
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$env:GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}
      - run: yarn install --immutable
      - run: yarn workspace dsh-desktop-next check:win-package
      - name: Build Next Windows installer
        env:
          DSH_PACKAGE_CHECK_ALREADY_RAN: '1'
        run: yarn workspace dsh-desktop-next dist:win

  # Upstream toolchain smoke: the portable-shell scripts must resolve the
  # pinned submodule's own Yarn/pnpm release on Windows.
  upstream-command-windows:
    needs: changes
    if: needs.changes.outputs.product == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: 22.23.2
      - run: corepack enable
      - run: yarn check:layout
      - run: yarn upstream:version
