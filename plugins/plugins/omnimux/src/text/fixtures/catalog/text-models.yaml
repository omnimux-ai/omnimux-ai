    label: "Fixture Claude Opus 5"
    family: "anthropic"
    operations:
      - id: "chat"
        label: "文本对话"
        output:
          type: "text"
        inputs:
          - slot: "prompt"
            type: "text"
            role: "prompt"
            source: "node_field"
            min: 1
            max: 1
        research:
          status: "verified"
          docUrl: "https://example.com/fixture"
        implementation:
          status: "ready"
          profileId: "textComplete"
          seam: "textComplete"
        execution:
          status: "live"
          profileId: "textComplete"
          seam: "textComplete"
