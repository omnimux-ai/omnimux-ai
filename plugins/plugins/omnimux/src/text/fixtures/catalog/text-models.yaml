# Fixture catalog for text execution tests: same verified+live statuses as the
# real catalog's admitted models, with real ids (channel groups and tool enums
# resolve real ids). Covers only the models and input shapes the tests exercise.
schemaVersion: "1.1"
managementGroup: "text"
modality: "text"

models:
