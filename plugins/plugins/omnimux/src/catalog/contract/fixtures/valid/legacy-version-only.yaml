# Input-only legacy root `version` (no schemaVersion).
# Loader preNormalizeDocRoot must migrate to schemaVersion "1.1" and strip version.
version: "1.0"
managementGroup: "text"
models:
  - id: "fixture-legacy-version"
    label: "Fixture Legacy Version"
    family: "fixture"
    aliases:
      - "legacy-wire-id"
    operations:
      - id: "chat"
        label: "文本对话"
        output:
          type: "text"
        inputs:
          - slot: "prompt"
            type: "text"
            role: "prompt"
            source: "node_field"
            min: 1
            max: 1
        research:
          status: "draft"
        execution:
          status: "none"
