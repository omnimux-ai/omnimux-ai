schemaVersion: "1.1"
managementGroup: "audio"
models:
  - id: "fixture-whisper"
    label: "Fixture Whisper"
    family: "openai"
    operations:
      - id: "speech_to_text"
        label: "语音识别"
        output:
          type: "text"
        inputs:
          - slot: "audio_input"
            type: "audio"
            role: "source"
            source: "upstream_edge"
            min: 1
            max: 1
            allowedMimes: ["audio/mp3", "audio/wav"]
            maxSizeMb: 25
            limitSource:
              kind: "official_docs"
              url: "https://example.com/whisper"
              note: "fixture limit"
        # promptPolicy=none — no prompt slot
    research:
      status: "draft"
      docUrl: "https://example.com/whisper"
    execution:
      status: "none"
      profileId: "speechToText"
      notes: "speechToText seam mounted (#538); model-level execution pending probe"
