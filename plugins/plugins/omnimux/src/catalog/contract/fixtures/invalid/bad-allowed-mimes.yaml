schemaVersion: "1.1"
managementGroup: "image"
models:
  - id: "fixture-bad-mimes"
    label: "Fixture Bad Mimes"
    family: "fixture"
    operations:
      - id: "text_to_image"
        label: "文生图"
        output:
          type: "image"
          allowedMimes: ["image/png", ""]
        inputs:
          - slot: "prompt"
            type: "text"
            role: "prompt"
            source: "node_field"
            min: 1
            max: 1
          - slot: "reference"
            type: "image"
            role: "reference"
            source: "upstream_edge"
            min: 1
            max: 1
            allowedMimes: []
    research:
      status: "draft"
    execution:
      status: "none"
