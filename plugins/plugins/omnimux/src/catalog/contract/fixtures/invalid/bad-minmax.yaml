schemaVersion: "1.1"
models:
  - id: "bad-minmax"
    label: "Bad MinMax"
    operations:
      - id: "multi_reference"
        label: "多图"
        output:
          type: "image"
        inputs:
          - slot: "prompt"
            type: "text"
            role: "prompt"
            source: "node_field"
            min: 1
            max: 1
          - slot: "reference_images"
            type: "image"
            role: "reference"
            min: 5
            max: 2
            allowedMimes: ["image/png"]
    research:
      status: "draft"
    execution:
      status: "none"
