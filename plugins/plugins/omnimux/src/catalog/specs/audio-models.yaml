  # #3063：Index TTS 声音克隆，上游契约已升级为 indextts-2（AutoDL 任务通道），
  # 旧型号 index-tts 已从上游模型列表下线，保留为 alias 兼容存量画布与账本记录。
  # 文档硬约束（zh/api-reference/audio-series/models/index-tts.mdx，2026-10-04 复核）：
  # POST /v1/tasks/autodl，必填 model=prompt_text（朗读文稿）/prompt_simple（参考音
  # 公网 URL）/emo_control_method（文档推荐「与音色参考音频相同」）；emo_happy/
  # emo_sad/emo_angry ∈ [0,1] 可选；轮询 GET /v1/tasks/{task_id}，产物经
  # GET /v1/tasks/{task_id}/artifacts 收取 WAV 直链。
  # 2026-10-21 网关对账 #3516：上游渠道全部停用，仅登记不开放。
  - id: "indextts-2"
    label: "Index TTS2 声音克隆"
    family: "indextts"
    badge: "声音克隆"
    subtitle: "Index TTS2 · 参考音 + 文稿直出克隆音色"
    operations:
      - id: "voice_clone"
        label: "声音克隆"
        output: { type: "audio" }
        inputs:
          - { slot: "prompt", type: "text", role: "prompt", source: "node_field", min: 1, max: 1 }
          - slot: "voice_sample"
            type: "audio"
            role: "audio_track"
            source: "upstream_edge"
            min: 1
            max: 1
            allowedMimes: ["audio/wav", "audio/mp3", "audio/mpeg"]
    parameters: {}
    research:
      status: "verified"
      docUrl: "https://docs.omnimux.ai/zh/api-reference/audio-series/models/index-tts"
      verifiedAt: "2026-10-04"
      notes: "渠道官方文档 zh/api-reference/audio-series/models/index-tts.mdx（OmniMux-docs 仓，2026-10-04 离线复核）：canonical 型号 indextts-2；POST /v1/tasks/autodl；必填 prompt_text（文稿）、prompt_simple（参考音 URL，不得 data: URI）、emo_control_method（推荐「与音色参考音频相同」）；可选 emo_happy/emo_sad/emo_angry ∈ [0,1]；轮询 GET /v1/tasks/{id}，产物 GET /v1/tasks/{id}/artifacts 取 WAV。旧型号 index-tts 已下线，保留 alias 兼容存量画布/账本。参考素材限制差异登记：上游合同 4b4e2aff3500ec80 的 reference_audios 为 {max:2, formats:[wav,mp3]}，本仓 voice_sample 声明 max=1 且不声明 maxSizeMb/maxDurationSec——max=1 因 AutoDL 契约只有单值 prompt_simple（参考音公网 URL），多值无落点；上游未公布 max_bytes_each 与 max_seconds_each，故不声明体积与时长上限；formats 转写为 MIME 并双写 audio/mp3 与 audio/mpeg，覆盖画布探测（audio/mpeg）与中枢探针归一（audio/mp3）两条通路。"
    implementation:
      # 2026-10-21 网关对账 #3516：上游渠道全部停用，仅登记不开放。
      status: "none"
      profileId: "audioGenerate"
