  - id: "seed-audio-1.0"
    label: "Seed Audio 1.0"
    family: "bytedance"
    badge: "语音合成"
    subtitle: "火山引擎 / 豆包大模型语音合成 · 509+ 精品音色"
    aliases: ["doubao-seed-audio-1.0", "seed-audio", "tts"]
    operations:
      - id: "text_to_speech"
        label: "文本转语音"
        output: { type: "audio" }
        inputs:
          - { slot: "prompt", type: "text", role: "prompt", source: "node_field", valueSources: ["local_field", "upstream_output"], composition: { kind: "single_body", localRole: "body" }, min: 1, max: 1 }
          - slot: "reference_audio"
            type: "audio"
            role: "reference"
            source: "upstream_edge"
            min: 0
            max: 1
            allowedMimes: ["audio/wav", "audio/mp3", "audio/mpeg"]
            maxSizeMb: 10
            limitSource:
              kind: "official_docs"
              note: "上游合同 4b4e2aff3500ec80：reference_audios {max:3, formats:[wav,mp3,pcm,ogg_opus], max_bytes_each:10485760, max_seconds_each:30}。maxSizeMb 取 max_bytes_each（10MB）。max 保持 1：同步语音仅写首条 references[{audio_url}]（submit-guard/map.js speech 分支），多值无落点。max_seconds_each=30 不落 maxDurationSec：画布本地导入不携带 durationSec，声明会让每次提交在 METADATA_UNKNOWN 被拒（seedasr-auc 同类判据）。formats 中 pcm/ogg_opus 本仓无对应 MIME 常量，不声明。上游另有 reference_images{max:1}，属本仓未登记的 voice_clone/reference_*_generation 操作，本仓 text_to_speech 的 vendor 形状白名单不含 image/images，故不新增参考图声明。"
    parameters:
      voice:
        # Resolved by the catalog loader; the DTO and SubmitGuard share one index.
        optionsFrom: "volcengine-voice-index"
        defaultValue: "zh_male_guanggaojieshuo_uranus_bigtts"
      speed:
        # Require a finite number without inventing undocumented bounds.
        range: {}
        defaultValue: 1.0
      format:
        options: ["mp3", "wav", "pcm"]
        defaultValue: "mp3"
    research:
      status: "verified"
      docUrl: "docs/evidence/2026-09-18-model-seed-audio-1-0-text_to_speech-live.md"
      verifiedAt: "2026-09-18"
      notes: "火山引擎 HTTP v3 语音合成接口网关真实执行与创作画布端到端验收通过（见 live 证据文档）"
    implementation:
      # 2026-10-21 网关对账 #3516：上游渠道全部停用，仅登记不开放。
      status: "none"
      profileId: "audioGenerate"
      seam: "audioGenerate"
    execution:
      status: "live"
      profileId: "audioGenerate"
      seam: "audioGenerate"
      notes: "同步 POST /v1/audio/speech 管道（2026-09-18 实测 200 返回 MP3 音频与元数据）"

