# 图像模型能力契约 (Image Models Capability Contract)
# H2: runtime image ID 全处置 = 契约行 + alias。
# 2026-09-14 #1751 对上游网关真相校正：
#   - 移除 gpt-image-2（SRC-4 明示旧 ID 不再接受、不是兼容别名）、midjourney（上游摘除映射、
#     变更日志 2026-09-13 条目（tags 为「不兼容变更 / 图像」）明写「旧 ID 不是兼容别名」）、
#     midjourney-niji-7、seedream-4.5（三方零命中）→ dispositions 置 unavailable。
#   - 改名：midjourney-8.1 → mj-v8-1、midjourney-7 → mj-v7（上游明示旧 ID 不是兼容别名，旧 ID 不保留）；
#     nano_banana_2 → nano-banana-2、nano_banana_pro → nano-banana-pro（上游在册为连字符形，
#     旧下划线写法进 aliases[]）；grok-imagine-image-2 → grok-imagine-image-2-0（SRC-4 公开 ID）。
#   - grok-imagine-image-2-0 撤销在售声明：上游两份独立清单零命中，降为已登记（research draft + execution stub）。
#   - 撤销 gpt-image-2.5-hd 的旧写法别名（gpt-image-2-hd / gpt-image2-hd，上游声明旧 ID 不再接受）。
# 余下 draft 行（证据不足不上架）。parameters 自旧 runtime SPECS 迁入。
schemaVersion: "1.1"
managementGroup: "image"
modality: "image"

models:

  - id: "gpt-image-2.5-hd"
    label: "GPT Image 2.5 HD"
    family: "openai"
    subtitle: "高清 4K"
    operations:
      - id: "text_to_image"
        label: "文生图"
        output:
          type: "image"
        inputs:
          - slot: "prompt"
            type: "text"
            role: "prompt"
            source: "node_field"
            min: 1
            max: 1
      - id: "multi_reference"
        label: "垫图参考"
        output:
          type: "image"
        inputs:
          - slot: "prompt"
            type: "text"
            role: "prompt"
            source: "node_field"
            min: 1
            max: 1
          - slot: "reference_image"
            type: "image"
            role: "reference"
            source: "upstream_edge"
            min: 0
            max: 1
            allowedMimes: ["image/png", "image/jpeg", "image/webp"]
            maxSizeMb: 10
            limitSource:
              kind: "policy_conservative"
              note: "本仓保守策略而非上游公布值：gpt-image-2.5-hd 在公开能力合同目录返回 HTTP 404，上游未公布数量、格式与单文件体积上限；max 1、mimes 与 10MB 均为本仓保守选择"
        implementation:
          status: "ready"
          profileId: "imageGenerate"
          seam: "imageGenerate"
          notes: "已落地 Edits 路由与发包映射"
    parameters:
      aspectRatio:
        options:
          - { value: "auto", label: "自适应" }
          - { value: "1:1", label: "1:1" }
          - { value: "16:9", label: "16:9" }
          - { value: "9:16", label: "9:16" }
          - { value: "4:3", label: "4:3" }
          - { value: "3:4", label: "3:4" }
          - { value: "3:2", label: "3:2" }
          - { value: "2:3", label: "2:3" }
          - { value: "21:9", label: "21:9" }
        defaultValue: "16:9"
      resolution:
        options:
          - { value: "2K", label: "2K" }
          - { value: "4K", label: "4K" }
        defaultValue: "2K"
      n:
        options:
          - { value: 1, label: "1 张" }
          - { value: 2, label: "2 张" }
          - { value: 4, label: "4 张" }
        defaultValue: 1
    research:
      status: "draft"
      notes: "runtime 存在；无独立 dated live 证据，不上架"
    implementation:
      status: "none"
    execution:
      status: "stub"
      profileId: "imageGenerate"
      seam: "imageGenerate"

