        output:
          type: video
          allowedMimes:
            - video/mp4
            - video/quicktime
        inputs:
          - slot: prompt
            type: text
            role: prompt
            source: node_field
            min: 1
            max: 1
        execution:
          status: stub
          profileId: videoGenerate
          seam: videoGenerate
          notes: 保留既有历史真实执行证据；本轮未新增真实请求
