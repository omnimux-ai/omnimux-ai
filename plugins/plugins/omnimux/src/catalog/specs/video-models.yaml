          - value: "9:16"
            label: "9:16"
          - value: "1:1"
            label: "1:1"
          - value: "4:3"
            label: "4:3"
          - value: "3:4"
            label: "3:4"
          - value: "21:9"
            label: "21:9"
          - value: adaptive
            label: "自适应"
        defaultValue: "16:9"
      duration:
        range:
          min: 4
          max: 15
          step: 1
        defaultValue: 5
        unit: s
      resolution:
        options:
          - value: 480p
            label: 480p
          - value: 720p
            label: 720p
        defaultValue: 720p
      sound:
        supported: true
        defaultValue: true
      seed:
        type: integer
      returnLastFrame:
        supported: true
        defaultValue: false
      webSearch:
        supported: true
        defaultValue: false
      nsfwCheck:
        supported: true
        defaultValue: false
    research:
      status: draft
      docUrl: https://docs.apimart.ai/en/api-reference/videos/seedance-2-0/generation.md
      verifiedAt: 2026-09-05
      notes: 能力和约束取 APIMart 官方 Seedance 2.0 文档；未知上限不以历史测试补齐
